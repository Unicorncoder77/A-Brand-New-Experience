{% extends "master.html" %}

{% block title %}
Reviewer Login 
{% endblock %}
{% block content %}
{% include "nav.html" %}
<style>
    .container {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
        display: inline-block;
        width: 350px;
    }

    h2 {
        color: black; 
        margin-bottom: 15px;
    }

    form {
        display: flex; 
        flex-direction: column;
        gap: 15px;
    }

    input {
        width: 100%;
        padding: 12px; 
        border: none;
        border-radius: 8px;
        font-size: 16px;
        outline: none;
        background: rgba(255, 255, 255, 0.2);
        color: black;
    }

    input::placeholder {
        color: rgba(255, 255, 255, 0.7);
    }

    button {
        background: linear-gradient(90deg, #ff416c, #ff4b2b);
        color: white;
        padding: 12px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 18px;
        font-weight: bold;
        transition: 0.3s;
    }

    button:hover {
        transform: scale(1.05);
        background: linear-gradient(90deg, #ff4b2b, #ff416c);
    }
</style>
    <div class="container">
        <h2> Login to Your Account </h2>
        <form method="POST">
            {% csrf_token %}
            <label for="username"> Username </label>
            {{ form.username }}

            <label for="password"> Password </label>
            {{ form.password }}

            <button type="submit"> Login </button>
        </form>
    </div>


{% endblock %}
