{% extends "master.html" %}

{% block title %}
Reviewer Signup
{% endblock %}
{% block content %}
{% include "nav.html" %}
    <style>
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 18px 16px rgba(0, 0, 0, 0.3);
            display: inline-block;
            width: 350px;
            text-align: center;
        }

        h2 {
            color: black;
            margin-bottom: 15px;
            text-align: center;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            text-align: center;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            background: rgba(249, 242, 242, 0.93);
            color: black;
            text-align: center;
        }

        input::placeholder {
            color: rgba(253, 246, 246, 0.94);
        }

        button {
            background: linear-gradient(90deg, #ff416c, #ff4b2b);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover {
            transform: sclae(1.05);
            background: linear-gradient(90deg, #ff4b2b, #ff416c);
        }

        .login-section {
            margin-top: 20px;
            font-size: 14px;
        }

        .login-btn {
            display: inline-block;
            margin-top: 10px;
            background: linear-gradient(90deg, #4facfe, #00f2fe);
            color: white; 
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
            text-decoration: none;
            transition: 0.3;
        }

        .login-btn:hover {
            transform: scale(1.05);
            background: linear-gradient(90deg, #00f2fe, #4facfe);
        }
    </style>
    <div class="container">
        <h2> Create your account </h2>
        <form method="POST">
            {% csrf_token %}
            <label for="username">Username</label>
            {{ form.username }}

            <label for="email">Email</label>
            {{ form.email }}

            <label for="password">Password</label>
            {{ form.password }}

            <button type="submit">Sign Up</button>
        </form>

        <div class="login-section">
            <p> Already have an account? </p>
            <a href="{% url 'login' %}" class="login-btn"> Login </a>
        </div>
    </div>
{% endblock %}
